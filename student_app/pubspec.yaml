name: cnhs_student_app
description: CNHS Student App - students link their account to their biometric record and see attendance, logs and notices.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  intl: ^0.20.2
  flutter_local_notifications: ^19.0.0
  workmanager: ^0.9.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
