name: Build Windows app

on:
  push:
    branches: [main]
    # Teacher-app-only commits do not rebuild the desktop app.
    # (Path filters are not applied to tag pushes, so `v*` tags always build.)
    paths-ignore:
      - 'teacher_app/**'
      - '.github/workflows/build-teacher-app.yml'
    tags: ['v*']
  pull_request:
    paths-ignore:
      - 'teacher_app/**'
      - '.github/workflows/build-teacher-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The Windows runner project is generated here so the repo stays small.
      - name: Generate Windows runner
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --project-name attendance_console --org com.school .
            Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          }

      - run: flutter pub get

      # teacher_app/ is excluded in the root analysis_options.yaml
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AttendanceConsole-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AttendanceConsole-windows
          path: AttendanceConsole-windows.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AttendanceConsole-windows.zip
