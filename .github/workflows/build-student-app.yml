name: Build student app (Android)

on:
  push:
    branches: [main]
    paths:
      - 'student_app/**'
      - '.github/workflows/build-student-app.yml'
    tags: ['student-v*']        # e.g. git tag student-v1.0.1 && git push origin student-v1.0.1
  pull_request:
    paths:
      - 'student_app/**'
      - '.github/workflows/build-student-app.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: student_app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # If student_app/android is committed (with your own edits) it is used as is.
      # Otherwise the Android project is generated here and patched with what the app needs:
      #   - INTERNET permission (release builds have none by default)
      #   - POST_NOTIFICATIONS permission (notifications on Android 13+)
      #   - core library desugaring (required by flutter_local_notifications)
      #   - the io.supabase.cnhs://login-callback deep link (Google sign-in / email links)
      - name: Prepare Android project
        run: |
          if [ -d android ]; then
            echo "Using the committed android/ folder."
            exit 0
          fi
          flutter create --platforms=android --project-name cnhs_student_app --org com.school .
          rm -f test/widget_test.dart   # the template test refers to a MyApp class this app does not have
          python3 - <<'PY'
          import os, re, sys

          # ---- manifest
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          # The Flutter template only grants INTERNET in debug/profile builds; a release APK needs it
          # (without it every request fails with "Failed host lookup").
          for perm in ('INTERNET', 'ACCESS_NETWORK_STATE'):
              if 'android.permission.' + perm + '"' not in s:
                  s = re.sub(r'(<manifest[^>]*>)',
                             r'\1\n    <uses-permission android:name="android.permission.' + perm + '"/>', s, count=1)
          if 'POST_NOTIFICATIONS' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>', s, count=1)
          if 'login-callback' not in s:
              intent = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <category android:name="android.intent.category.BROWSABLE"/>
                      <data android:scheme="io.supabase.cnhs" android:host="login-callback"/>
                  </intent-filter>'''
              s = s.replace('</activity>', intent + '\n        </activity>', 1)
          # Supabase (app_links) handles the sign-in link itself; Flutter's own deep-link handling
          # must be off or the two fight over the same link and the session is never created.
          if 'flutter_deeplinking_enabled' not in s:
              s = re.sub(r'(<application[^>]*>)',
                         r'\1\n        <meta-data android:name="flutter_deeplinking_enabled" android:value="false"/>', s, count=1)
          open(p, 'w').write(s)
          if 'flutter_deeplinking_enabled' not in s:
              sys.exit('Could not patch AndroidManifest.xml (deep linking flag)')
          if 'android.permission.INTERNET"' not in s or 'POST_NOTIFICATIONS' not in s or 'login-callback' not in s:
              sys.exit('Could not patch AndroidManifest.xml')

          # ---- gradle (Kotlin DSL or Groovy, depending on the Flutter version)
          kts, groovy = 'android/app/build.gradle.kts', 'android/app/build.gradle'
          if os.path.exists(kts):
              g = open(kts).read()
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              ok = 'isCoreLibraryDesugaringEnabled' in g
              open(kts, 'w').write(g)
          elif os.path.exists(groovy):
              g = open(groovy).read()
              g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              ok = 'coreLibraryDesugaringEnabled' in g
              open(groovy, 'w').write(g)
          else:
              sys.exit('No app-level gradle file found')
          if not ok:
              sys.exit('Could not patch the gradle file (no compileOptions block found)')
          print('Android project patched.')
          PY

      - run: flutter pub get

      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # Repo secrets: Settings > Secrets and variables > Actions
      #   SUPABASE_URL, SUPABASE_ANON_KEY   (the anon/public key only, never the service-role key)
      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: CNHS-Student-App-apk
          path: student_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/student-v')
        uses: softprops/action-gh-release@v2
        with:
          files: student_app/build/app/outputs/flutter-apk/app-release.apk
